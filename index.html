<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>onlymanes.ai · V1 内测</title>
<link rel="icon" href="avatar.png">
<style>
  :root { --bg:#faf8f4; --card:#fff; --ink:#2b2620; --muted:#8a8378; --accent:#b98a3e; --line:#e8e2d6; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  .wrap { max-width:720px; margin:0 auto; padding:24px 16px 120px; }
  header { display:flex; align-items:center; gap:14px; margin-bottom:8px; }
  header img { width:56px; height:56px; border-radius:50%; }
  header h1 { font-size:20px; margin:0; }
  header h1 small { display:block; font-size:12px; color:var(--muted); font-weight:normal; }
  .badge { display:inline-block; font-size:12px; color:#fff; background:var(--accent);
           border-radius:20px; padding:2px 10px; margin-left:8px; vertical-align:middle; }
  #log { background:var(--card); border:1px solid var(--line); border-radius:14px;
         min-height:300px; max-height:56vh; overflow-y:auto; padding:16px; }
  .msg { margin:10px 0; line-height:1.7; }
  .msg .who { font-size:12px; color:var(--muted); margin-bottom:2px; }
  .msg.me { text-align:right; }
  .msg.me .bubble { display:inline-block; background:#f3ecdd; border-radius:12px 12px 2px 12px;
                    padding:8px 12px; max-width:80%; text-align:left; }
  .msg.ai .bubble { display:inline-block; background:#f7f5f1; border:1px solid var(--line);
                    border-radius:12px 12px 12px 2px; padding:8px 12px; max-width:80%; }
  .bar { position:fixed; left:0; right:0; bottom:0; background:var(--bg);
         border-top:1px solid var(--line); padding:12px 16px; }
  .bar .row { max-width:720px; margin:0 auto; display:flex; gap:8px; }
  #input { flex:1; padding:12px; font-size:15px; border:1px solid var(--line);
           border-radius:10px; }
  #send { padding:12px 22px; font-size:15px; border:none; border-radius:10px;
          background:var(--accent); color:#fff; cursor:pointer; }
  .status { max-width:720px; margin:6px auto 0; font-size:12px; color:var(--muted); }
  footer { text-align:center; color:var(--muted); font-size:12px; margin-top:28px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="avatar.png" alt="onlymanes">
    <h1>onlymanes.ai <span class="badge">V1 内测</span>
      <small>唯有灵魂 · 个人智能测试页</small></h1>
  </header>

  <div id="authBox">
    <p style="color:var(--muted); font-size:14px;">请输入你的登录口令：</p>
    <div class="row" style="max-width:720px; margin:0 auto; display:flex; gap:8px;">
      <input id="token" type="password" placeholder="口令" autocomplete="off"
             style="flex:1; padding:12px; font-size:15px; border:1px solid var(--line); border-radius:10px;">
      <button id="login" style="padding:12px 22px; font-size:15px; border:none; border-radius:10px;
              background:var(--accent); color:#fff; cursor:pointer;">登录</button>
    </div>
    <p id="authErr" style="color:#b3402e; font-size:13px; min-height:18px;"></p>
  </div>

  <div id="userBar" style="display:none; align-items:center; gap:8px; margin:14px 0;">
    <span id="whoami" style="font-size:14px;"></span>
    <button id="logout" style="padding:6px 14px; font-size:13px; border:1px solid var(--line);
            border-radius:8px; background:var(--card); cursor:pointer;">退出</button>
  </div>

  <div id="chatBox" style="display:none;">
    <div id="log"></div>
  </div>

  <footer>此为临时测试页 · onlymanes.ai/test</footer>
</div>

<div class="bar">
  <div class="row">
    <input id="input" placeholder="输入消息…" autocomplete="off">
    <button id="send">发送</button>
  </div>
  <div class="status" id="status">后端连接中…</div>
</div>

<script>
/* 后端 API 地址：Worker 已上线；也可在控制台用 localStorage.setItem('om_api','https://…') 覆盖 */
const API_BASE = localStorage.getItem('om_api') || 'https://onlymanes-api.onlymanes.workers.dev';
const log = document.getElementById('log');
const input = document.getElementById('input');
const statusEl = document.getElementById('status');
const authBox = document.getElementById('authBox');
const userBar = document.getElementById('userBar');
const chatBox = document.getElementById('chatBox');
const authErr = document.getElementById('authErr');
let user = null; // 身份只由服务器会话决定

function session() { return localStorage.getItem('om_session') || ''; }

function showLogin() {
  user = null;
  authBox.style.display = 'block';
  userBar.style.display = 'none';
  chatBox.style.display = 'none';
}
function showChat(name) {
  authBox.style.display = 'none';
  userBar.style.display = 'flex';
  chatBox.style.display = 'block';
  document.getElementById('whoami').textContent = name + ' 已登录';
}

function addMsg(who, text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.innerHTML = '<div class="who">' + who + '</div><div class="bubble"></div>';
  d.querySelector('.bubble').textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}

async function doLogin() {
  const token = document.getElementById('token').value.trim();
  if (!token) return;
  authErr.textContent = '';
  try {
    const r = await fetch(API_BASE + '/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({token})
    });
    const j = await r.json();
    if (j.ok) {
      localStorage.setItem('om_session', j.session);
      user = j.user;
      const name = user === 'helen' ? '张春晖' : '晓晖';
      showChat(name);
      addMsg('onlymanes', '你好' + name + '，我是 onlymanes。V1 内测中。', 'ai');
      statusEl.textContent = '已连接';
    } else {
      authErr.textContent = j.error || '登录失败';
    }
  } catch (e) {
    authErr.textContent = '连接失败：' + e.message;
  }
}
document.getElementById('login').onclick = doLogin;
document.getElementById('token').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

document.getElementById('logout').onclick = async () => {
  try {
    await fetch(API_BASE + '/api/logout', {
      method: 'POST',
      headers: {'Authorization': 'Bearer ' + session()}
    });
  } catch (e) {}
  localStorage.removeItem('om_session');
  log.innerHTML = '';
  showLogin();
};

async function send() {
  const text = input.value.trim();
  if (!text || !session()) return;
  input.value = '';
  addMsg(user === 'helen' ? '张春晖' : '晓晖', text, 'me');
  statusEl.textContent = '思考中…';
  try {
    const r = await fetch(API_BASE + '/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + session()},
      body: JSON.stringify({message: text})
    });
    if (r.status === 401) {
      localStorage.removeItem('om_session');
      showLogin();
      authErr.textContent = '会话已过期，请重新登录。';
      return;
    }
    const j = await r.json();
    addMsg('onlymanes', j.reply || '(空回复）', 'ai');
  } catch (e) {
    addMsg('onlymanes', '连接失败：' + e.message, 'ai');
  }
  statusEl.textContent = '已连接';
}
document.getElementById('send').onclick = send;
input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

/* 打开页面时尝试恢复会话 */
(async function init() {
  const s = session();
  if (!s) { showLogin(); return; }
  try {
    const r = await fetch(API_BASE + '/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + s},
      body: JSON.stringify({message: ''})
    });
    if (r.status === 401) { localStorage.removeItem('om_session'); showLogin(); return; }
    const j = await r.json();
    user = j.user;
    showChat(user === 'helen' ? '张春晖' : '晓晖');
    addMsg('onlymanes', '欢迎回来，我是 onlymanes。', 'ai');
    statusEl.textContent = '已连接';
  } catch (e) { showLogin(); }
})();

/* 访问统计 beacon：记录独立访客，bot 判定在服务端做（启发式） */
(function () {
  try {
    fetch(API_BASE + '/api/visit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: location.pathname,
        ref: document.referrer,
        lang: navigator.language,
        tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
        vw: window.innerWidth, vh: window.innerHeight,
        touch: 'ontouchstart' in window,
        webdriver: !!navigator.webdriver,
      }),
    }).catch(function () {});
  } catch (e) {}
})();
</script>
</body>
</html>
