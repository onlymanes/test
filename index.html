<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>onlymanes.ai · V1 内测</title>
<link rel="icon" href="avatar.png">
<style>
  :root { --bg:#faf8f4; --card:#fff; --ink:#2b2620; --muted:#8a8378; --accent:#b98a3e; --line:#e8e2d6; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  .wrap { max-width:720px; margin:0 auto; padding:24px 16px 120px; }
  header { display:flex; align-items:center; gap:14px; margin-bottom:8px; }
  header img { width:56px; height:56px; border-radius:50%; }
  header h1 { font-size:20px; margin:0; }
  header h1 small { display:block; font-size:12px; color:var(--muted); font-weight:normal; }
  .badge { display:inline-block; font-size:12px; color:#fff; background:var(--accent);
           border-radius:20px; padding:2px 10px; margin-left:8px; vertical-align:middle; }
  .users { display:flex; gap:8px; margin:14px 0; }
  .users button { flex:1; padding:10px; border:1px solid var(--line); border-radius:10px;
                  background:var(--card); font-size:15px; cursor:pointer; }
  .users button.active { border-color:var(--accent); background:#fdf6e9; font-weight:bold; }
  #log { background:var(--card); border:1px solid var(--line); border-radius:14px;
         min-height:300px; max-height:56vh; overflow-y:auto; padding:16px; }
  .msg { margin:10px 0; line-height:1.7; }
  .msg .who { font-size:12px; color:var(--muted); margin-bottom:2px; }
  .msg.me { text-align:right; }
  .msg.me .bubble { display:inline-block; background:#f3ecdd; border-radius:12px 12px 2px 12px;
                    padding:8px 12px; max-width:80%; text-align:left; }
  .msg.ai .bubble { display:inline-block; background:#f7f5f1; border:1px solid var(--line);
                    border-radius:12px 12px 12px 2px; padding:8px 12px; max-width:80%; }
  .bar { position:fixed; left:0; right:0; bottom:0; background:var(--bg);
         border-top:1px solid var(--line); padding:12px 16px; }
  .bar .row { max-width:720px; margin:0 auto; display:flex; gap:8px; }
  #input { flex:1; padding:12px; font-size:15px; border:1px solid var(--line);
           border-radius:10px; }
  #send { padding:12px 22px; font-size:15px; border:none; border-radius:10px;
          background:var(--accent); color:#fff; cursor:pointer; }
  .status { max-width:720px; margin:6px auto 0; font-size:12px; color:var(--muted); }
  footer { text-align:center; color:var(--muted); font-size:12px; margin-top:28px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="avatar.png" alt="onlymanes">
    <h1>onlymanes.ai <span class="badge">V1 内测</span>
      <small>唯有灵魂 · 个人智能测试页</small></h1>
  </header>

  <div class="users">
    <button id="u-helen" class="active">张春晖</button>
    <button id="u-alan">晓晖</button>
  </div>

  <div id="log"></div>

  <footer>此为临时测试页 · onlymanes.ai/test</footer>
</div>

<div class="bar">
  <div class="row">
    <input id="input" placeholder="输入消息…" autocomplete="off">
    <button id="send">发送</button>
  </div>
  <div class="status" id="status">后端连接中…</div>
</div>

<script>
/* 后端 API 地址：Worker 上线后填入（或在控制台执行 localStorage.setItem('om_api','https://…')） */
const API_BASE = localStorage.getItem('om_api') || '';
let user = 'helen';
const log = document.getElementById('log');
const input = document.getElementById('input');
const statusEl = document.getElementById('status');

function addMsg(who, text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.innerHTML = '<div class="who">' + who + '</div><div class="bubble"></div>';
  d.querySelector('.bubble').textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}

document.getElementById('u-helen').onclick = e => {
  user = 'helen';
  e.target.classList.add('active');
  document.getElementById('u-alan').classList.remove('active');
  addMsg('系统', '已切换到张春晖', 'ai');
};
document.getElementById('u-alan').onclick = e => {
  user = 'alan';
  e.target.classList.add('active');
  document.getElementById('u-helen').classList.remove('active');
  addMsg('系统', '已切换到晓晖', 'ai');
};

async function send() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addMsg(user === 'helen' ? '张春晖' : '晓晖', text, 'me');
  if (!API_BASE) {
    addMsg('onlymanes', '后端尚未连接，请稍后再试。', 'ai');
    return;
  }
  statusEl.textContent = '思考中…';
  try {
    const r = await fetch(API_BASE + '/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({user, message: text})
    });
    const j = await r.json();
    addMsg('onlymanes', j.reply || '(空回复）', 'ai');
  } catch (e) {
    addMsg('onlymanes', '连接失败：' + e.message, 'ai');
  }
  statusEl.textContent = API_BASE ? '已连接' : '后端连接中…';
}
document.getElementById('send').onclick = send;
input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

addMsg('onlymanes', '你好，我是 onlymanes。V1 内测中，后端连接后即可对话。', 'ai');
statusEl.textContent = API_BASE ? '已连接' : '后端连接中…';
</script>
</body>
</html>
